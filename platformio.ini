; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Firmware for ESP82xx/ESP32 for Shelly Emulator

[env]
framework = arduino
monitor_speed = 115200
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.3.0
	tzapu/WiFiManager@2.0.17
	esp32async/ESPAsyncWebServer@^3.10.2
	emelianov/modbus-esp8266@^4.1.0
	olliiiver/SML Parser@^0.29
extra_scripts = pre:generate_chart_header.py
                pre:patch_wifimanager.py

build_flags =  !python get_version.py
			   -DWM_NODEBUG 
			   

[env:esp32]
platform = espressif32 @ ^8.0.0
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
 ${env.build_flags}
 -DNOWIFIMANAGERASYNC
board_build.f_cpu = 80000000L

[env:esp8266]
platform = espressif8266 @ ^4.2.1
board = nodemcuv2
build_flags =
 ${env.build_flags}
lib_deps = ${env.lib_deps}
	vshymanskyy/Preferences@^2.1.0
board_build.f_cpu = 80000000L

[env:esp32-s3]
platform = espressif32 @ ^8.0.0
board = esp32-s3-devkitc-1
build_flags =
 ${env.build_flags}
 -DNOWIFIMANAGERASYNC
 -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.f_cpu = 80000000L

[env:esp32-c3]
platform = espressif32 @ ^8.0.0
board = esp32-c3-devkitm-1
build_flags =
 ${env.build_flags}
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DARDUINO_USB_MODE=1
 -DNOWIFIMANAGERASYNC
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
board_build.f_cpu = 80000000L


[env:esp32-s3-N8]
platform = espressif32 @ ^8.0.0
board = esp32-s3-devkitc-1
build_flags =
 ${env.build_flags}
 -DNOWIFIMANAGERASYNC
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DONA_ACTIVE
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

