name: CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '/doc/**'
      - '/screenshots/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
          
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          
      - name: Install latest esptool
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --upgrade esptool
          
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
        
      - name: Build Base Branch Sizes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          mkdir ../pr-branch && cp -r . ../pr-branch
          git fetch origin ${{ github.base_ref }}
          git checkout FETCH_HEAD
          pio run > ../base_sizes.txt || true
          rm -rf * && cp -r ../pr-branch/. .
        env:
          PLATFORMIO_SETTING_ENABLE_TELEMETRY: "No"

      - name: Build firmware
        run: pio run
        
      - name: Collect Head Branch Sizes (PR only)
        if: github.event_name == 'pull_request'
        run: pio run > ../head_sizes.txt || true

      - name: Generate Memory Comparison Report
        if: github.event_name == 'pull_request'
        run: |
          python3 -c "
          import re, os

          def parse_sizes(filepath):
              if not os.path.exists(filepath): return {}
              with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              
              blocks = content.split('Processing ')
              
              data = {}
              for block in blocks[1:]:
                  lines = block.split('\n')
                  if not lines: continue
                  env_name = lines[0].split()[0]
                  ram_val, ram_total, flash_val, flash_total = 0, 0, 0, 0
                  for line in lines:
                      if 'RAM:' in line:
                          m = re.search(r'used\s+(\d+)\s+bytes\s+from\s+(\d+)\s+bytes', line)
                          if m: 
                              ram_val = int(m.group(1))
                              ram_total = int(m.group(2))
                      if 'Flash:' in line:
                          m = re.search(r'used\s+(\d+)\s+bytes\s+from\s+(\d+)\s+bytes', line)
                          if m: 
                              flash_val = int(m.group(1))
                              flash_total = int(m.group(2))
                  if ram_val > 0 or flash_val > 0:
                      data[env_name] = {'ram': ram_val, 'ram_total': ram_total, 'flash': flash_val, 'flash_total': flash_total}
              return data

          base_data = parse_sizes('../base_sizes.txt')
          head_data = parse_sizes('../head_sizes.txt')

          def fmt_diff(b):
              if b == 0: return 'No change'
              return f'{b:+d} B ({b/1024:+.2f} KB)'

          def fmt_usage(used, total):
              if total == 0: return f'{used/1024:.2f} KB'
              pct = (used / total) * 100
              return f'{used/1024:.2f} KB ({pct:.1f}%)'

          report = '### 📊 ESP Memory Usage Summary (ROM / RAM)\n\n'
          report += '| Environment | Memory | Base Branch | PR Branch (Usage %) | Difference |\n'
          report += '| --- | --- | --- | --- | --- |\n'

          all_envs = sorted(list(set(base_data.keys()) | set(head_data.keys())))
          for env in all_envs:
              b_ram = base_data.get(env, {}).get('ram', 0)
              h_ram = head_data.get(env, {}).get('ram', 0)
              h_ram_tot = head_data.get(env, {}).get('ram_total', 0)
              
              b_fl  = base_data.get(env, {}).get('flash', 0)
              h_fl  = head_data.get(env, {}).get('flash', 0)
              h_fl_tot  = head_data.get(env, {}).get('flash_total', 0)
              
              report += f'| **{env}** | RAM (Static) | {b_ram/1024:.2f} KB | {fmt_usage(h_ram, h_ram_tot)} | {fmt_diff(h_ram - b_ram)} |\n'
              report += f'| | ROM (Flash) | {b_fl/1024:.2f} KB | {fmt_usage(h_fl, h_fl_tot)} | {fmt_diff(h_fl - b_fl)} |\n'

          with open('../pr_comment.md', 'w') as f:
              f.write(report)
          "

      - name: Post Comment to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: esp_size_report   
          path: ../pr-comment.md    

      - name: Merge ESP32 flash files
        run: |
          cd .pio/build/esp32
          python3 -m esptool --chip esp32 merge_bin -o merged-flash.bin --flash_mode dio --flash_size 4MB 0x1000 bootloader.bin 0x8000 partitions.bin 0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 firmware.bin
          
      - name: Merge ESP32-S3 flash files
        run: |
          cd .pio/build/esp32-s3
          python3 -m esptool --chip esp32-s3 merge_bin -o merged-flash.bin --flash_mode dio --flash_freq 80m --flash_size 4MB 0x0000 bootloader.bin 0x8000 partitions.bin 0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 firmware.bin
          
      - name: Merge ESP32-C3 flash files
        run: |
          cd .pio/build/esp32-c3
          python3 -m esptool --chip esp32-c3 merge_bin -o merged-flash.bin --flash_mode dio --flash_freq 80m --flash_size 4MB 0x0000 bootloader.bin 0x8000 partitions.bin 0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 firmware.bin
          
      - name: Copy firmware
        run: |
          cp .pio/build/esp32/merged-flash.bin ./.github/pages/esp32.bin
          cp .pio/build/esp32/firmware.bin ./.github/pages/esp32-ota.bin
          cp .pio/build/esp8266/firmware.bin ./.github/pages/esp8266.bin
          cp .pio/build/esp32-s3/merged-flash.bin ./.github/pages/esp32-s3.bin
          cp .pio/build/esp32-c3/merged-flash.bin ./.github/pages/esp32-c3.bin
          cp .pio/build/esp32-s3/firmware.bin ./.github/pages/esp32-s3-ota.bin
          cp .pio/build/esp32-c3/firmware.bin ./.github/pages/esp32-c3-ota.bin
          
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            ./.github/pages/esp32.bin
            ./.github/pages/esp32-ota.bin
            ./.github/pages/esp8266.bin
            ./.github/pages/esp32-s3.bin
            ./.github/pages/esp32-s3-ota.bin
            ./.github/pages/esp32-c3.bin
            ./.github/pages/esp32-c3-ota.bin
            
      - name: Setup Github Page
        uses: actions/configure-pages@v6
        
      - name: Upload webflash files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.github/pages/
          
  deploy:
    needs: build
    if: github.ref_type == 'tag'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write   
      pages: write      
      id-token: write   
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          name: firmware
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./esp8266.bin
            ./esp32.bin
            ./esp32-ota.bin
            ./esp32-s3.bin
            ./esp32-s3-ota.bin
            ./esp32-c3.bin
            ./esp32-c3-ota.bin
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
